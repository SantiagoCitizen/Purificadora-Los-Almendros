<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Web - Los Almendros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles-index.css">
</head>
<body class = "d-flex bg-light">

    <!-- Barra lateral-->
    <aside class = "sidebar bg-white border-end d-flex flex-column align-items-center py-3 sticky-top">
        <!--Logo (cuando lo tenga xd)-->

        <div class = "mb-4 text-center">
            <i class = "bi bi-droplet-fill text-primary fs-1"></i>
        </div>
    <!--Navegacion-->
        <ul class = "nav nav-pills flex-column w-100 px-2 text-center">
            <li class = "nav-item mb-2">
                <a href="#" class = "nav-link text-dark active bg-light text-primary fw-bold" aria-current="page">
                    <i class="bi bi-card-checklist fs-3 d-block mb-1 text-dark"></i>
                    <small style = "font-size: 0.75 rem;">Principal</small>
                </a>
            </li>
        <li class = "nav-item mb-2">
            <a href="#" class="nav-link text-muted">
                <i class ="bi bi-box-seam fs-3 d-block mb-1"></i>
                <small style="font-size: 0.75rem;">Reportes</small>
            </a>
        </li>
        <li class="nav-item mb-2">
            <a href="#" class="nav-link text-muted">
                <i class = "bi bi-person-fill fs-3 d-block mb-1"></i>
                <small style="font-size: 0.75rem;">Usuarios</small>
            </a>
        </li>
        <li class="nav-item mb-2">
            <a href="#" class="nav-link text-muted">
                <i class="bi bi-gear-fill fs-3 d-block mb-1"></i>
                <small style="font-size: 0.75rem;">Ajustes</small>
            </a>
        </li>
        </ul>
    </aside>

    <!--Contenido del lado derecho-->
    <div class="flex-grow-1 d-flex flex-column">
        <!--Contenido superior-->
        <header class="bg-white border-bottom py-3 px-4 d-flex align-items-center">
            <h4 class="mb-0 fw-bold">
                Agua Los Almendros <span class="text-muted fw-normal ms-2 fs-5">- Panel de Administracion</span>
            </h4>
        </header>
    </div>



    <!-- Contenido principal -->
    <main class = "container-fluid p-4">
        <!-- El Resumen -->
        <section class = "row mb - 4">
            <article class = "col-md-6 mb-3">
                <div class = "card shadow-sm h-100 border-0 border-start border-primary border-4">
                    <h5 class = "text-muted">Precio base Actual</h5>
                    <h2 class = "display-6 fw-bold text-dark">$26.00 MXN</h2>
                </div>
            </article>

            <article class = "col-md-6 mb-3">
                <div class = "card shadow-sm h-100 border-0 border-start border-success border-4">
                    <div class = "card-body text-center">
                    <h5 class = "text-muted">Estado Actual del Servidor</h5>
                    <h2 class = "display-6 fw-bold text-success">Conectando...</h2>
                    </div>
                </div>
            </article>
        </section>

        <!-- Tabla de datos (colonias) -->
        <section class = "row">
            <div class = "col-12">
                <div class="card shadow-sm border 0 rounded-3">
                    <div class="card-header bg-white py-3 border-bottom-0">
                        <h5 class="mb-0 fw-bold text-center">Colonias</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped mb-0 text-center align-items-middle">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th>ID</th>
                                        <th>Colonia</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="2" class="py-4 text-muted">
                                            <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                            Buscando en la base de datos...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
    </main>

    <!-- BACKEND -->
    <script src="js/api.js"></script>
</body>
</html>
