<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Web - Los Almendros</title>
</head>
<body>
    <!-- CABECERA DEL PANEL -->
    <header>
        <h1>Agua Los Almendros</h1>
        <p>Panel de Control Logístico y Operativo</p>
    </header>

    <!-- Contenido principal -->
    <main>
        <!-- El Resumen -->
        <section>
            <article>
                <div>
                    <h5>Precio base Actual</h5>
                    <h2>$26.00 MXN</h2>
                </div>
            </article>

            <article>
                <div>
                    <h5>Estado Actual del Servidor</h5>
                    <h2>Conectando...</h2>
                </div>
            </article>
        </section>

        <!-- Tabla de datos (coberturas) -->
        <section>
            <div>
                <h4>Zonas de cobertura activas</h4>
            </div>

            <div>
                <!-- Tabla html -->
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Colonia</th>
                        </tr>
                    </thead>
                    
                    <!-- Quedara vacio pq se va a llenar con Python/JS -->
                    <tbody>
                        <tr>
                            <td colspan="2">Buscando en la base de datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- BACKEND -->
    <script src="js/api.js"></script>
</body>
</html>
